# HexDM greeter settings. Installed to /etc/hexdm/hexdm.conf.
#
# Every line is "key = value". Delete a line (or the whole file) to get the
# default back. A line HexDM can't read is logged and ignored.

# What moves behind the login screen. One of:
#   hexgrid    a field of hexagons with pulses running through it
#   starfield  drifting stars over a faint nebula
#   horizon    a glowing grid running off to the horizon
#   aurora     slow curtains of light
#   rain       falling columns of data
#   plain      just the base colour
#   random     a different one each start
background = hexgrid

# Colours, as #RRGGBB.
base    = #07050D
primary = #6B2FB3
accent  = #22E4FF
text    = #ECE8F7
dim     = #7D7799
error   = #FF3B5C
success = #3DFFA8
warning = #FFB454

# Effects. 0 turns one off, 1 is the default strength, up to 4.
bloom     = 1
scanlines = 0.35
vignette  = 0.8

# 24h or 12h.
clock = 24h

# With more than one monitor, the login screen is on the primary one.
# "background" draws the moving background on the others, "off" leaves them.
secondary_displays = background
